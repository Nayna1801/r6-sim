<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>R6 Draft Sim</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css?v=4">
<link rel="stylesheet" href="css/fx.css?v=4">
<link rel="stylesheet" href="css/game.css?v=4">
</head>
<body>
<div id="sparks" aria-hidden="true"></div>
<div id="fx" aria-hidden="true"></div>
<header class="top">
  <div class="brand"><b>R6</b> DRAFT<span>SIM</span></div>
  <div id="hudBar" class="hudbar hidden">
    <span id="hudSide" class="hudside"></span>
    <button id="hudMap" class="hudmap" type="button"></button>
    <div id="hudScore" class="score"></div>
  </div>
  <div id="hdrTools" class="tools"></div>
</header>
<div id="netbar" class="netbar hidden"></div>
<main id="app">
  <section id="screenMenu" class="screen"></section>
  <section id="screenGame" class="screen hidden">
    <div class="gamegrid">
      <div id="stageHost" class="stagehost"></div>
      <aside class="sidecol">
        <div id="rosterOwn" class="roster own"></div>
        <div id="rosterRival" class="roster rival"></div>
        <div id="log" class="log"></div>
      </aside>
    </div>
  </section>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="js/engine.js?v=4"></script>
<script src="js/ai.js?v=4"></script>
<script src="js/match.js?v=4"></script>
<script src="js/controllers.js?v=4"></script>
<script src="js/i18n.js?v=4"></script>
<script src="js/net.js?v=4"></script>
<script src="js/ui/core.js?v=4"></script>
<script src="js/ui/components.js?v=4"></script>
<script src="js/ui/screens.js?v=4"></script>
<script src="js/ui/controller.js?v=4"></script>
<script src="js/app.js?v=4"></script>
</body>
</html>
